- type: job
  id: STGuardianNt
  name: stories-job-name-guardian-nt
  description: stories-job-description-guardian-nt
  playTimeTracker: STJobGuardianNt
  setPreference: false
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 10h
    - !type:DepartmentTimeRequirement
      department: Security
      time: 5h
    - !type:DepartmentTimeRequirement
      department: Command
      time: 3h
  startingGear: STGuardianNtGear
  icon: "STJobIconGuardianNt"
  supervisors: job-supervisors-centcom
  accessGroups:
  - AllAccess
  access:
  - CentralCommand
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: Force
    - type: ForceUser
      preset: Guardian
  minBankBalance: 250
  maxBankBalance: 300

- type: startingGear
  id: STGuardianNtGear
  equipment:
    head: STClothingHeadHatBeretGuardianNt
    jumpsuit: STClothingUniformJumpsuitGuardianNt
    back: STClothingBackpackSatchelGuardianNt
    eyes: STClothingEyesGlassesCentcom
    ears: STClothingHeadsetGuardianNtAlt
    gloves: ClothingHandsGlovesCombat
    shoes: STClothingShoesBootsJackGuardianNt
    id: STGuardianNtPDA
    outerClothing: STClothingOuterVestGuardianNt
    neck: STClothingNeckMantleGuardianNt
    belt: ClothingBeltSecurityFilled
    pocket1: STLightsaberWhite

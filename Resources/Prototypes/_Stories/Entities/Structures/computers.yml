    - Cryogenics
    - Engineering
    - External
    - GenpopEnter
    - GenpopLeave
    - HeadOfPersonnel
    - HeadOfSecurity
    - Hydroponics
    - Janitor
    - Kitchen
    - Lawyer
    - Maintenance
    - Medical
    - Quartermaster
    - Research
    - ResearchDirector
    - Salvage
    - Security
    - Service
    - Theatre
    - CentralCommand
    - STDSO
  - type: Computer

    - ChiefEngineer
    - ChiefMedicalOfficer
    - Command
    - Cryogenics
    - Engineering
    - External
    - GenpopEnter
    - GenpopLeave
    - HeadOfPersonnel
    - HeadOfSecurity
    - Hydroponics
    - Janitor
    - Kitchen
    - Lawyer
    - Maintenance
    - Medical
    - Quartermaster
    - Research
    - ResearchDirector
    - Salvage
    - Security
    - Service
    - Theatre
    - CentralCommand
    - STDSO
  - type: Computer
    board: STComputerIdCircuitboardCentcom

- type: entity
  id: STComputerCargoOrdersCentComm
  parent: ComputerCargoOrders
  name: centcomm request computer
  description: Used by the Centcomm department to order supplies.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: request-med
      color: "#0f8551"
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: CargoOrderConsole
    account: STCentComm
    announcementChannel: CentCom
    removeLimitAccess: [ "Quartermaster" ]
  - type: ActiveRadio
    channels:
    - CentCom
  #- type: Computer
  #  board: CargoRequestMedicalComputerCircuitboard
  - type: PointLight
    color: "#0f8551"
  - type: AccessReader
    access: [["CentralCommand", "Cargo"]]
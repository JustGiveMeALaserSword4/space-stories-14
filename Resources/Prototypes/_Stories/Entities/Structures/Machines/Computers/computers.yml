- type: entity
  parent: ComputerComms
  id: STCentcomComputerComms
  name: centcom communications computer
  components:
    - type: AccessReader
      access: [[ "Command" ]]
    - type: CommunicationsConsole
      title: comms-console-announcement-title-centcom
      global: true
      sound:
        path: /Audio/Announcements/centcomm.ogg
        params:
          volume: -4

- type: entity
  parent: BaseComputerShuttle
  id: STPRISONComputerShuttle
  name: shuttle console prison
  description: Used for piloting a ship or escaping from prison.
  components:
    - type: Sprite
      sprite: _Stories/Structures/Machines/computers_sp.rsi
      layers:
        - map: ["computerLayerBody"]
          state: computer_sp
        - map: ["computerLayerKeyboard"]
          state: generic_keyboard_sp
        - map: ["computerLayerScreen"]
          state: shuttle_sp
        - map: ["computerLayerKeys"]
          state: generic_keys_sp
    - type: Computer
      board: STPRISONComputerShuttleCircuitboard
    - type: DroneConsole
      components:
        - type: PrisonShuttle

- type: entity
  parent: ComputerId
  id: STPRISONComputerId
  name: ID card computers
  description: Terminal for programming Nanotrasen employee ID cards to access parts of the prison.
  components:
  - type: Sprite
    sprite: _Stories/Structures/Machines/computers_sp.rsi
    layers:
        - map: ["computerLayerBody"]
          state: computer_sp
        - map: ["computerLayerKeyboard"]
          state: generic_keyboard_sp
        - map: ["computerLayerScreen"]
          state: id_sp
        - map: ["computerLayerKeys"]
          state: generic_keys_sp
  - type: IdCardConsole
    accessLevels:
    - Command
    - Bar
    - Brig
    - Security
    - Maintenance
    - External
    - Armory
    - Prisoner
    - STPrisonEng
    - STPrisonMed
    - Prison
    - STPrisonBrig
    - STHeadOfPrison
  - type: Computer
    board: STPRISONComputerIdCircuitboard

- type: entity
  parent: BaseComputerAiAccess
  id: STComputerBankSecurity
  name: security financial console
  description: Used by security to issue fines to specific personnel.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: id
    - map: ["computerLayerKeys"]
      state: security_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: AccessReader
    access: [["Security"]]
  - type: BankSecurityConsole
  - type: ActivatableUI
    key: enum.BankSecurityConsoleUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.BankSecurityConsoleUiKey.Key:
        type: BankSecurityConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: BaseComputerAiAccess
  id: STComputerBankCentcom
  name: central command economic console
  description: A highly advanced terminal used by Central Command to fully manage and manipulate station economies.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: comm_logs
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: AccessReader
    access: [["CentralCommand"]]
  - type: BankCentcomConsole
  - type: ActivatableUI
    key: enum.BankCentcomConsoleUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: UserInterface
    interfaces:
      enum.BankCentcomConsoleUiKey.Key:
        type: BankCentcomConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: CentcommComputerComms
  id: STDSOComputerComms
  name: Department of Special Operations communications console
  description: A computer used to make world wide announcements via keyboard. The superior cousin of the regular communications computer.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      sprite: _Stories/Structures/Machines/computers.rsi
      state: comm_DSO
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: AccessReader
    access: [[ "STDSO" ]]
  - type: CommunicationsConsole
    title: stories-comms-console-announcement-title-DSO
    color: "#1d8bad"
    sound:
      path: /Audio/_Stories/Announcements/DSO_announce.ogg
      params:
        volume: -4
  - type: Computer
    board: CentcommCommsComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#00FF00"


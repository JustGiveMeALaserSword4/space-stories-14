- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: STClothingHeadHelmetHardsuitCentcomSecurity
  name: centcom officer hardsuit helmet
  description: A modified riot helmet. Oddly comfortable.
  components:
  - type: Sprite
    sprite: _Stories/Clothing/Head/Hardsuits/centcom_security.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _Stories/Clothing/Head/Hardsuits/centcom_security.rsi
    clothingVisuals:
      head:
      - state: equipped-head
  - type: PointLight
    color: "#c4ff99"
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: equipped-head-unshaded
        shader: unshaded
  - type: PressureProtection
    highPressureMultiplier: 0.525
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
